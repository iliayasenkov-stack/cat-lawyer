name: Deploy Cat Lawyer to Cloudflare Pages

concurrency:
  group: cat-lawyer-pages-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy . --project-name=cat-lawyer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test real AI chat
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          response=$(curl -sS -X POST "https://cat-lawyer.pages.dev/api/chat" -H "Content-Type: application/json" --data '{"message":"Я купил товар в магазине, хочу вернуть его, но продавец отказывается. Чек есть. Что мне делать по закону РФ? Ответь кратко и по делу."}' -w "\nHTTP_STATUS:%{http_code}")
          echo "$response"
          status=$(printf "%s" "$response" | sed -n 's/^HTTP_STATUS://p')
          if [ "$status" != "200" ]; then
            echo "AI smoke test failed with HTTP $status"
            exit 1
          fi
          body=$(printf "%s" "$response" | sed '/^HTTP_STATUS:/d')
          if ! printf "%s" "$body" | python -c 'import json,sys,re; d=json.load(sys.stdin); r=str(d.get("reply","")).strip(); bad=("в течение 7 дней" in r.lower() or "8-800-100-100-8" in r); sys.exit(0 if len(r)>=40 and not bad else 1)'; then
            echo "AI smoke test failed: empty, suspiciously short, or known-unsafe legal reply"
            exit 1
          fi
