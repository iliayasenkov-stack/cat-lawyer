<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — Cat Lawyer</title><link rel="stylesheet" href="/styles.css"></head><body><header class="wrap nav"><a class="brand" href="/"><img src="/assets/cat-lawyer-logo.svg" alt="Cat Lawyer"> CAT LAWYER</a><a class="btn light" href="/">На сайт</a></header><main class="content"><section class="section"><div class="wrap"><div class="head"><span class="eyebrow">ADMIN</span><h2>Панель Cat Lawyer</h2><p>Введите секретный ключ администратора, заданный в Cloudflare Worker.</p></div><div class="form"><input id="key" type="password" placeholder="Административный ключ"><button class="btn orange" id="load">Войти в панель</button><p id="status" class="status"></p></div><div id="stats" class="grid3" style="margin-top:18px"></div><div class="form" id="reviews" style="margin-top:18px;display:none"></div></div></section></main><script>const $=id=>document.getElementById(id);let key='';async function load(){key=$('key').value.trim();if(!key)return $('status').textContent='Введите ключ.';const h={'X-Admin-Key':key};try{const [s,r]=await Promise.all([fetch('/api/admin/stats',{headers:h}),fetch('/api/admin/reviews',{headers:h})]);const sd=await s.json(),rd=await r.json();if(!s.ok)throw Error(sd.error||'Доступ запрещён');$('stats').innerHTML='<article class="card"><h3>Пользователи</h3><div class="amount">'+sd.users+'</div></article><article class="card"><h3>Консультации</h3><div class="amount">'+sd.conversations+'</div></article><article class="card"><h3>Отзывы</h3><div class="amount">'+sd.reviews+'</div></article>';$('reviews').style.display='block';$('reviews').innerHTML='<h3>Модерация отзывов</h3>'+(rd.items||[]).map(x=>'<div class="history-item"><b>'+esc(x.name)+' · '+(x.approved?'опубликован':'скрыт')+'</b><p>'+esc(x.text)+'</p><button class="btn light" onclick="toggle(\''+x.id+'\','+(x.approved?0:1)+')">'+(x.approved?'Скрыть':'Опубликовать')+'</button> <button class="btn light" onclick="del(\''+x.id+'\')">Удалить</button></div>').join('');$('status').textContent='Панель загружена.'}catch(e){$('status').textContent=e.message}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function toggle(id,approved){await fetch('/api/admin/reviews',{method:'POST',headers:{'content-type':'application/json','X-Admin-Key':key},body:JSON.stringify({id,approved})});load()}async function del(id){await fetch('/api/admin/reviews/delete',{method:'POST',headers:{'content-type':'application/json','X-Admin-Key':key},body:JSON.stringify({id})});load()}$('load').onclick=load;</script></body></html>
